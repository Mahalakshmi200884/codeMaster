<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMaster</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Welcome to CodeMaster</h1>

<p>Learn Programming from Basic to Advanced</p>

<a href="dashboard.html">
<button class="start-btn">Start Learning</button>
</a>

</div>
<input type="text" id="search" placeholder="Search Course..." onkeyup="searchCourse()">

<div id="result"></div>
  <script>
const courses = [
    "Python",
    "Java",
    "C",
    "HTML",
    "CSS",
    "SQL",
    "JavaScript",
    "C++"
];

function searchCourse() {
    let input = document.getElementById("search").value.toLowerCase();
    let result = document.getElementById("result");

    result.innerHTML = "";

    if(input === "") return;

    courses.forEach(course => {
        if(course.toLowerCase().startsWith(input)) {
            result.innerHTML += `
            <button onclick="location.href='register.html'">
                ${course}
            </button><br><br>`;
        }
    });
}
</script>
</body>
</html>
