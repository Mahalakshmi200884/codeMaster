<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Welcome to CodeMaster</h1>

<button class="start-btn">Start Learning</button>

</div>
<input type="text" id="search" placeholder="Search Course..." onkeyup="searchCourse()">

<div id="result"></div>
  <script>
const courses = [
    "Python",
    "Java",
    "C",
    "HTML",
    "CSS",
    "SQL",
    "JavaScript",
    "C
  }
  function searchCourse() {
    let input = document.getElementById("search").value.toLowerCase();
    let result = document.getElementById("result");

    result.innerHTML = "";

    if (input == "") return;

    courses.forEach(course => {
        if (course.toLowerCase().startsWith(input)) {

            let page = "";

            if(course == "Python") page = "python.html";
            else if(course == "Java") page = "java.html";
            else if(course == "HTML") page = "html.html";
            else if(course == "CSS") page = "css.html";
            else if(course == "SQL") page = "sql.html";
            else page = "register.html";
     result.innerHTML += `
     result.innerHTML += `
<button onclick="localStorage.setItem('selectedCourse','${course}');window.location.href='register.html';">
${course}
</button><br><br>
`;
      
        }
    });
}
</script>
</body>
</html>
